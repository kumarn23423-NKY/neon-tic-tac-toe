<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Tic Tac Toe - Nitish Kumar Yadav</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #1a1c38 0%, #0a0c1a 70%, #04050d 100%);
      font-family: 'Rajdhani', sans-serif;
      color: #00f0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Ambient Glows */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(0, 240, 255, 0.12);
      filter: blur(100px);
      top: 10%;
      left: 15%;
      border-radius: 50%;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 0, 127, 0.12);
      filter: blur(100px);
      bottom: 10%;
      right: 15%;
      border-radius: 50%;
      pointer-events: none;
    }

    .game-card {
      background: rgba(13, 18, 38, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.08);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 2;
    }

    /* Header & Branding */
    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.3);
      text-transform: uppercase;
    }

    .author {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ff007f;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* Mode Selector */
    .mode-selector {
      display: flex;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      padding: 4px;
      width: 100%;
      margin-bottom: 18px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: #8b9bb4;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .mode-btn.active {
      background: rgba(0, 240, 255, 0.2);
      color: #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
      border: 1px solid rgba(0, 240, 255, 0.5);
    }

    /* Scoreboard */
    .scoreboard {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: rgba(5, 8, 20, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .score-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #8a9bb0;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .score-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .score-x .score-value {
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    .score-o .score-value {
      color: #ff007f;
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }

    .score-ties .score-value {
      color: #ffb700;
      text-shadow: 0 0 8px rgba(255, 183, 0, 0.6);
    }

    /* Turn Indicator */
    .turn-indicator {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .turn-x { color: #00f0ff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.6); }
    .turn-o { color: #ff007f; text-shadow: 0 0 8px rgba(255, 0, 127, 0.6); }

    /* Board Grid */
    .board-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      max-width: 320px;
      margin-bottom: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .cell {
      background: rgba(20, 28, 58, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6);
    }

    .cell:hover:not(.taken) {
      background: rgba(0, 240, 255, 0.15);
      border-color: rgba(0, 240, 255, 0.5);
      transform: translateY(-2px);
    }

    .cell.x {
      color: #00f0ff;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.8), 0 0 30px rgba(0, 240, 255, 0.4);
    }

    .cell.o {
      color: #ff007f;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.8), 0 0 30px rgba(255, 0, 127, 0.4);
    }

    /* Winning Line Canvas Overlay */
    .win-line-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Game Controls & Overlay */
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-reset {
      background: linear-gradient(135deg, #00f0ff, #0072ff);
      color: #050811;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    .btn-reset:hover {
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
      transform: translateY(-2px);
    }

    .btn-sound {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #8a9bb0;
      max-width: 90px;
    }

    .btn-sound.active {
      color: #00f0ff;
      border-color: rgba(0, 240, 255, 0.5);
    }

    /* Modal Banner for Winner */
    .result-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 14, 30, 0.95);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .result-modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .result-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .result-sub {
      font-size: 1rem;
      color: #8a9bb0;
      margin-bottom: 24px;
    }

    .result-modal .btn {
      max-width: 200px;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <!-- Header -->
    <div class="header">
      <div class="title">TIC TAC TOE</div>
      <div class="author">By Nitish Kumar Yadav</div>
    </div>

    <!-- Mode Switcher -->
    <div class="mode-selector">
      <button class="mode-btn active" id="mode-2p" onclick="setMode('2p')">2 Players</button>
      <button class="mode-btn" id="mode-ai" onclick="setMode('ai')">vs AI (Bot)</button>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-box score-x">
        <span class="score-label" id="label-x">Player X</span>
        <span class="score-value" id="score-x">0</span>
      </div>
      <div class="score-box score-ties">
        <span class="score-label">Ties</span>
        <span class="score-value" id="score-ties">0</span>
      </div>
      <div class="score-box score-o">
        <span class="score-label" id="label-o">Player O</span>
        <span class="score-value" id="score-o">0</span>
      </div>
    </div>

    <!-- Turn Indicator -->
    <div class="turn-indicator" id="turn-indicator">
      Turn: <span class="turn-x" id="turn-text">PLAYER X</span>
    </div>

    <!-- Game Board -->
    <div class="board-container">
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      <canvas class="win-line-canvas" id="win-canvas"></canvas>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-reset" onclick="resetGame()">Restart Game</button>
      <button class="btn btn-sound active" id="sound-btn" onclick="toggleSound()">Sound</button>
    </div>

    <!-- Result Modal Overlay -->
    <div class="result-modal" id="result-modal">
      <div class="result-title" id="result-title">X WINS!</div>
      <div class="result-sub" id="result-sub">Great match!</div>
      <button class="btn btn-reset" onclick="closeModal()">Play Again</button>
    </div>
  </div>

  <script>
    let boardState = Array(9).fill('');
    let currentPlayer = 'X';
    let isGameActive = true;
    let gameMode = '2p';
    let scores = { X: 0, O: 0, ties: 0 };
    let soundEnabled = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'tie') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.25);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-btn');
      btn.classList.toggle('active', soundEnabled);
      btn.innerText = soundEnabled ? 'Sound' : 'Mute';
    }

    const winConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    const canvas = document.getElementById('win-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawWinLine(condition, color) {
      resizeCanvas();
      const cells = document.querySelectorAll('.cell');
      const startCell = cells[condition[0]].getBoundingClientRect();
      const endCell = cells[condition[2]].getBoundingClientRect();
      const container = canvas.parentElement.getBoundingClientRect();

      const x1 = startCell.left + startCell.width / 2 - container.left;
      const y1 = startCell.top + startCell.height / 2 - container.top;
      const x2 = endCell.left + endCell.width / 2 - container.left;
      const y2 = endCell.top + endCell.height / 2 - container.top;

      let progress = 0;
      function animateLine() {
        if (progress > 1) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 + (x2 - x1) * progress, y1 + (y2 - y1) * progress);
        ctx.strokeStyle = color;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
        ctx.stroke();

        progress += 0.08;
        requestAnimationFrame(animateLine);
      }
      animateLine();
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function setMode(mode) {
      if (gameMode === mode) return;
      gameMode = mode;
      document.getElementById('mode-2p').classList.toggle('active', mode === '2p');
      document.getElementById('mode-ai').classList.toggle('active', mode === 'ai');
      
      document.getElementById('label-o').innerText = mode === 'ai' ? 'AI (Bot)' : 'Player O';
      scores = { X: 0, O: 0, ties: 0 };
      updateScoreUI();
      resetGame();
    }

    const cells = document.querySelectorAll('.cell');
    cells.forEach(cell => cell.addEventListener('click', handleCellClick));

    function handleCellClick(e) {
      const index = e.target.getAttribute('data-index');

      if (boardState[index] !== '' || !isGameActive) return;

      makeMove(index, currentPlayer);

      if (isGameActive && gameMode === 'ai' && currentPlayer === 'O') {
        setTimeout(makeAIMove, 400);
      }
    }

    function makeMove(index, player) {
      boardState[index] = player;
      const cell = cells[index];
      cell.innerText = player;
      cell.classList.add(player.toLowerCase(), 'taken');
      playSound('click');

      checkResult();

      if (isGameActive) {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateTurnUI();
      }
    }

    function updateTurnUI() {
      const turnText = document.getElementById('turn-text');
      if (currentPlayer === 'X') {
        turnText.innerText = 'PLAYER X';
        turnText.className = 'turn-x';
      } else {
        turnText.innerText = gameMode === 'ai' ? 'AI (BOT)' : 'PLAYER O';
        turnText.className = 'turn-o';
      }
    }

    function makeAIMove() {
      if (!isGameActive) return;

      let bestScore = -Infinity;
      let bestMove;

      for (let i = 0; i < 9; i++) {
        if (boardState[i] === '') {
          boardState[i] = 'O';
          let score = minimax(boardState, 0, false);
          boardState[i] = '';
          if (score > bestScore) {
            bestScore = score;
            bestMove = i;
          }
        }
      }

      if (bestMove !== undefined) {
        makeMove(bestMove, 'O');
      }
    }

    function minimax(board, depth, isMaximizing) {
      let result = checkWinnerForMinimax();
      if (result === 'O') return 10 - depth;
      if (result === 'X') return depth - 10;
      if (result === 'tie') return 0;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (board[i] === '') {
            board[i] = 'O';
            let score = minimax(board, depth + 1, false);
            board[i] = '';
            bestScore = Math.max(score, bestScore);
          }
        }
        return bestScore;
      } else {
        let bestScore = Infinity;
        for (let i = 0; i < 9; i++) {
          if (board[i] === '') {
            board[i] = 'X';
            let score = minimax(board, depth + 1, true);
            board[i] = '';
            bestScore = Math.min(score, bestScore);
          }
        }
        return bestScore;
      }
    }

    function checkWinnerForMinimax() {
      for (let condition of winConditions) {
        const [a, b, c] = condition;
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          return boardState[a];
        }
      }
      if (!boardState.includes('')) return 'tie';
      return null;
    }

    function checkResult() {
      let roundWon = false;
      let winningCondition = null;

      for (let condition of winConditions) {
        const [a, b, c] = condition;
        if (boardState[a] === '' || boardState[b] === '' || boardState[c] === '') continue;

        if (boardState[a] === boardState[b] && boardState[b] === boardState[c]) {
          roundWon = true;
          winningCondition = condition;
          break;
        }
      }

      if (roundWon) {
        isGameActive = false;
        scores[currentPlayer]++;
        updateScoreUI();
        playSound('win');
        
        const lineColor = currentPlayer === 'X' ? '#00f0ff' : '#ff007f';
        drawWinLine(winningCondition, lineColor);

        setTimeout(() => {
          showModal(
            `${currentPlayer === 'X' ? 'PLAYER X' : (gameMode === 'ai' ? 'AI' : 'PLAYER O')} WINS!`,
            currentPlayer === 'X' ? '#00f0ff' : '#ff007f'
          );
        }, 600);
        return;
      }

      if (!boardState.includes('')) {
        isGameActive = false;
        scores.ties++;
        updateScoreUI();
        playSound('tie');
        setTimeout(() => {
          showModal("IT'S A TIE!", "#ffb700");
        }, 300);
      }
    }

    function updateScoreUI() {
      document.getElementById('score-x').innerText = scores.X;
      document.getElementById('score-o').innerText = scores.O;
      document.getElementById('score-ties').innerText = scores.ties;
    }

    function showModal(title, color) {
      const modal = document.getElementById('result-modal');
      const modalTitle = document.getElementById('result-title');
      modalTitle.innerText = title;
      modalTitle.style.color = color;
      modalTitle.style.textShadow = `0 0 15px ${color}`;
      modal.classList.add('show');
    }

    function closeModal() {
      document.getElementById('result-modal').classList.remove('show');
      resetGame();
    }

    function resetGame() {
      boardState = Array(9).fill('');
      isGameActive = true;
      currentPlayer = 'X';
      clearCanvas();
      updateTurnUI();

      cells.forEach(cell => {
        cell.innerText = '';
        cell.className = 'cell';
      });
    }
  </script>
</body>
</html>
